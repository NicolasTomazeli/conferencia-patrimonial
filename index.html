<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2330">
<title>Conferência Patrimonial</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<!-- ===== MENU ===== -->
<section id="telaMenu">
  <header><h1>Conferência Patrimonial</h1></header>
  <main>
    <div class="card">
      <h2>Base de ativos</h2>
      <div id="baseInfo">Verificando...</div>
      <div class="linha">
        <label class="btn sec">Atualizar base
          <input type="file" id="arqBase" accept=".txt,.tsv,.csv,.xlsx,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
        </label>
      </div>
    </div>
    <div class="pilha" style="margin-top:14px">
      <button id="btnNova">Nova conferência</button>
      <button id="btnContinuar" class="sec">Continuar conferência</button>
      <button id="btnFinalizadas" class="sec">Conferências finalizadas</button>
      <label class="btn sec">Importar conferência (continuar de outro aparelho)
        <input type="file" id="arqConf" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
      </label>
    </div>
    <div class="info" id="menuMsg"></div>
    <div class="rodape" id="rodape"></div>
  </main>
</section>

<!-- ===== NOVA CONFERÊNCIA ===== -->
<section id="telaNova" hidden>
  <header><button class="mini sec" data-voltar>Voltar</button><h1>Nova conferência</h1></header>
  <main>
    <label class="campo">Número da filial onde você está
      <input type="number" id="novaFilial" inputmode="numeric" min="1" max="9999" placeholder="Ex.: 90">
    </label>
    <div class="info" id="novaFilialInfo"></div>
    <label class="campo">Seu nome
      <input type="text" id="novaUsuario" autocomplete="name" placeholder="Quem está conferindo">
    </label>
    <label class="campo">Setor inicial (opcional)
      <input type="text" id="novaSetor" placeholder="Ex.: Recepção">
    </label>
    <div class="info erro" id="novaErro"></div>
    <div class="linha"><button id="btnCriar">Iniciar conferência</button></div>
  </main>
</section>

<!-- ===== LISTA (continuar / finalizadas) ===== -->
<section id="telaLista" hidden>
  <header><button class="mini sec" data-voltar>Voltar</button><h1 id="listaTitulo">Conferências</h1></header>
  <main>
    <div class="info" id="listaVazia" hidden>Nenhuma conferência aqui.</div>
    <ul class="lista" id="listaConfs"></ul>
  </main>
</section>

<!-- ===== LEITURA ===== -->
<section id="telaLeitura" hidden>
  <header>
    <button class="mini sec" id="btnPausar">Menu</button>
    <h1>Filial <span id="leFilial"></span><br><span class="cod" id="leCodigo"></span></h1>
    <button class="mini sec" id="btnLanterna" hidden>Lanterna</button>
  </header>
  <main>
    <label class="campo" style="margin-top:0">Setor atual (vale para as próximas leituras)
      <input type="text" id="leSetor" placeholder="Ex.: Recepção">
    </label>

    <div class="cam">
      <video id="video" playsinline muted></video>
      <div class="mira" id="mira"></div>
      <div class="ligar" id="ligarCam"><button id="btnCamera">Ligar câmera</button></div>
    </div>
    <div class="info" id="camMsg"></div>

    <div class="card ultimo" id="ultimo">
      <div class="num" id="ultNum">—</div>
      <div class="desc" id="ultDesc">Aponte a câmera para a plaqueta.</div>
      <div class="sit" id="ultSit"></div>
    </div>

    <div class="linha">
      <input type="number" id="manual" inputmode="numeric" placeholder="Digitar número" style="margin-top:0">
      <button id="btnManual" class="sec" style="flex:0 0 120px">Adicionar</button>
    </div>

    <div class="contadores">
      <div><b id="cTotal">0</b><span>lidos</span></div>
      <div><b id="cFilial">0</b><span id="cFilialRot">da filial</span></div>
      <div><b id="cTransf">0</b><span>outra filial</span></div>
      <div><b id="cNao">0</b><span>não cadastr.</span></div>
    </div>

    <div class="linha">
      <button id="btnParcial" class="sec">Enviar parcial</button>
      <button id="btnFinalizar" class="ok">Finalizar</button>
    </div>

    <div class="card">
      <h2>Itens lidos (toque para remover)</h2>
      <ul class="lista" id="listaLidos"></ul>
      <div class="info" id="listaMais" hidden></div>
    </div>
  </main>
</section>

<script src="lib/xlsx.full.min.js"></script>
<script src="comum.js"></script>
<script src="app.js"></script>
</body>
</html>
